# Copy this file to ~/.config/substack2pdf/config.ini and fill in your values.
# Do not commit your real config.ini file.
#
# Recommended: create a dedicated sender account used ONLY for Kindle delivery,
# e.g. your-name.kindlesender@gmail.com — then approve that address on Amazon.
# If credentials leak, your main inbox is unaffected.
#
# After saving, restrict access to your machine only:
#   chmod 600 ~/.config/substack2pdf/config.ini

[smtp]
host = smtp.gmail.com
port = 587
user = yourname.kindlesender@gmail.com
# Gmail app password for the dedicated sender account (not your main password).
password = your-app-password
use_tls = true

[kindle]
# Your Kindle email address from Amazon (e.g. name@kindle.com).
email = yourname@kindle.com
